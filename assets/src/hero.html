<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 700px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    background: #08161C;
  }
  .hero {
    position: relative;
    width: 1600px;
    height: 700px;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 82% 8%, rgba(28, 122, 132, 0.34), transparent 62%),
      radial-gradient(600px 380px at 6% 104%, rgba(217, 83, 43, 0.07), transparent 70%),
      linear-gradient(148deg, #071319 0%, #0B2129 52%, #081A21 100%);
  }
  /* 城市网格 */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(1200px 700px at 70% 30%, #000 12%, transparent 78%);
  }
  .hairline {
    position: absolute; left: 0; right: 0; top: 500px; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.14) 12%, rgba(255,255,255,0.14) 88%, rgba(255,255,255,0) 100%);
  }
  .left { position: absolute; left: 92px; top: 80px; width: 760px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 15px; letter-spacing: 3.4px; color: #6FC0C4; font-weight: 600;
    text-transform: uppercase;
  }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: #E8A33D; box-shadow: 0 0 14px rgba(232,163,61,.9); }
  .eyebrow .sep { width: 26px; height: 1px; background: rgba(111,192,196,.55); }
  h1 {
    margin-top: 22px;
    font-size: 78px; line-height: 1.1; letter-spacing: -2px; font-weight: 800;
    color: #F6FBFC;
  }
  h1 .accent { color: #E8A33D; }
  .sub {
    margin-top: 22px; font-size: 23px; line-height: 1.62; color: #9FB8C0; font-weight: 400;
    max-width: 700px;
  }
  .sub b { color: #DCEDEF; font-weight: 600; }
  .chain { margin-top: 28px; display: flex; align-items: center; gap: 10px; }
  .chain span {
    font-size: 15px; color: #8FB2BA; padding: 7px 15px; border-radius: 999px;
    border: 1px solid rgba(143,178,186,.28); background: rgba(255,255,255,.035);
    letter-spacing: 1px;
  }
  .chain i { width: 18px; height: 1px; background: rgba(143,178,186,.34); display: inline-block; }
  .art { position: absolute; right: 0; top: 0; width: 820px; height: 470px; }
  .metrics {
    position: absolute; left: 92px; right: 92px; top: 540px;
    display: grid; grid-template-columns: repeat(6, 1fr);
  }
  .m { position: relative; padding-left: 26px; }
  .m:first-child { padding-left: 0; }
  .m + .m::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.16), rgba(255,255,255,0));
  }
  .m .num { font-size: 40px; font-weight: 700; letter-spacing: -0.6px; color: #FFFFFF; font-variant-numeric: tabular-nums; }
  .m .num small { font-size: 19px; font-weight: 600; color: #9FB8C0; margin-left: 4px; letter-spacing: 0; }
  .m .lab { margin-top: 10px; font-size: 15px; font-weight: 400; color: #7C9AA3; letter-spacing: 0.6px; }
  .m.t .num { color: #7FD3D0; }
  .m.a .num { color: #F0B65E; }
  .m.o .num { color: #E8836B; }
</style>
</head>
<body>
<div class="hero">
  <div class="grid"></div>
  <div class="art"><svg id="net" width="820" height="470" viewBox="0 0 820 470"></svg></div>

  <div class="left">
    <div class="eyebrow"><span class="dot"></span>SHENZHEN<span class="sep"></span>2021.05.01 — 05.03</div>
    <h1>一座城市的<br><span class="accent">72 小时</span>呼吸</h1>
    <div class="sub">深圳五一假期共享单车运营分析<br>用 <b>336 万条订单</b>重建骑行行为，切出 <b>14 个骑行社区</b></div>
    <div class="chain">
      <span>清洗</span><i></i><span>时空</span><i></i><span>网络</span><i></i><span>预测</span>
    </div>
  </div>

  <div class="hairline"></div>

  <div class="metrics">
    <div class="m"><div class="num">3,364,413</div><div class="lab">原始订单</div></div>
    <div class="m"><div class="num">3,189,049</div><div class="lab">有效骑行 · 保留 94.8%</div></div>
    <div class="m t"><div class="num">1,206,439</div><div class="lab">骑行者</div></div>
    <div class="m a"><div class="num">3,908,281<small>km</small></div><div class="lab">累计里程</div></div>
    <div class="m o"><div class="num">14</div><div class="lab">骑行社区 · 模块度 0.833</div></div>
    <div class="m"><div class="num">0.907</div><div class="lab">需求预测 R² · MAE 10.3 辆</div></div>
  </div>
</div>

<script>
(function () {
  // 确定性随机
  let s = 20210501;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  const svg = document.getElementById('net');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  // 14 个簇，位置大致呼应深圳的片区分组（仅作装饰）
  const clusters = [
    [150, 120, 34], [196, 205, 26], [128, 268, 30], [90, 350, 24],
    [250, 300, 22], [318, 210, 30], [300, 330, 20], [392, 268, 24],
    [430, 352, 26], [352, 392, 18], [500, 300, 22], [560, 348, 18],
    [610, 286, 16], [700, 312, 14]
  ];
  const nodes = [];
  clusters.forEach((c, ci) => {
    const n = 5 + Math.floor(rnd() * 5);
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * c[2];
      nodes.push({ x: c[0] + Math.cos(a) * r, y: c[1] + Math.sin(a) * r * 0.82, r: 1.6 + rnd() * 2.2, c: ci });
    }
  });

  // 簇内连边
  const g = el('g', { stroke: '#5FB6BC', 'stroke-width': 0.7, opacity: 0.20 });
  nodes.forEach((a, i) => nodes.forEach((b, j) => {
    if (j <= i || a.c !== b.c) return;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 34) g.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
  }));
  svg.appendChild(g);

  // 簇间弧线（流向）
  const arcs = el('g', { fill: 'none' });
  const pairs = [[0,3],[1,5],[2,4],[5,7],[4,8],[7,9],[8,10],[6,2],[11,12],[12,13],[3,6],[9,11],[0,1],[10,13]];
  pairs.forEach(([i, j], k) => {
    const A = clusters[i], B = clusters[j];
    const mx = (A[0] + B[0]) / 2 + (rnd() - 0.5) * 60;
    const my = (A[1] + B[1]) / 2 - 40 - rnd() * 50;
    const p = el('path', {
      d: `M${A[0]} ${A[1]} Q${mx} ${my} ${B[0]} ${B[1]}`,
      stroke: k % 3 === 0 ? '#E8A33D' : '#3E9AA3',
      'stroke-width': k % 3 === 0 ? 1.1 : 0.8,
      opacity: 0.16 + rnd() * 0.22,
      'stroke-linecap': 'round'
    });
    arcs.appendChild(p);
  });
  svg.appendChild(arcs);

  // 节点
  nodes.forEach(nd => {
    const hot = nd.r > 3.2;
    svg.appendChild(el('circle', {
      cx: nd.x, cy: nd.y, r: nd.r,
      fill: hot ? '#E8A33D' : '#7FD3D0',
      opacity: hot ? 0.85 : 0.55
    }));
  });
  // 光晕
  const defs = el('defs', {});
  const rg = el('radialGradient', { id: 'glow' });
  rg.appendChild(el('stop', { offset: '0%', 'stop-color': '#2E8C8C', 'stop-opacity': '0.55' }));
  rg.appendChild(el('stop', { offset: '100%', 'stop-color': '#2E8C8C', 'stop-opacity': '0' }));
  defs.appendChild(rg);
  svg.insertBefore(defs, svg.firstChild);
  clusters.slice(0, 6).forEach((c) => {
    svg.insertBefore(el('circle', {
      cx: c[0], cy: c[1], r: 90, fill: 'url(#glow)'
    }), svg.firstChild.nextSibling);
  });
})();
</script>
</body>
</html>
